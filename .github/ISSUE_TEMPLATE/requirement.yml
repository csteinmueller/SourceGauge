name: Requirement
description: Propose a functional (FR) or non-functional (NFR) requirement.
title: "req: "
labels: [requirement, triage]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Functional (FR)
        - Non-functional (NFR)
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Requirement statement
      description: "Use 'The analyzer shall …'. One testable statement."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Link to the vision goal this supports.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, measurable.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: [Must, Should, Could, "Won't (this time)"]
    validations:
      required: true
  - type: markdown
    attributes:
      value: Once accepted, the requirement is recorded in `docs/requirements/` with a stable `REQ-xxxx` ID.
